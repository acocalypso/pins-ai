name: Verify inference contracts
on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: dotnet run --project plugin/tests/Pins.AI.Tests/Pins.AI.Tests.csproj -c Release
      - run: dotnet format plugin/src/Pins.AI.Runtime/Pins.AI.Runtime.csproj --no-restore --verify-no-changes
      - run: python -m py_compile plugin/scripts/install-assets.py plugin/scripts/benchmark.py plugin/tests/fake-llama.py plugin/tests/runtime-smoke.py
      - run: gcc -std=c11 -O2 -Wall -Wextra -Werror plugin/native/pins-ai-exec.c -o /tmp/pins-ai-exec
      - run: bash -n plugin/scripts/install-plugin.sh
      - run: python -m pip install jsonschema==4.25.1 transformers==4.57.6
      - run: python training/prepare.py
      - run: python training/tests/training_tests.py
      - run: python training/datasets/mcp-v2/scripts/validate_dataset.py
      - run: python training/tests/v2_tests.py
      - run: python training/tests/colab_tests.py
      - run: python training/tests/curriculum_tests.py
      - run: python training/tests/comprehensive_tests.py
      - run: dotnet run --project training/tools/RouterAudit -- training/datasets/mcp-chat/train.jsonl training/datasets/mcp-v2/data/verified-tools-list.json artifacts/router-chat-v5.json
      - run: python training/tests/chat_dataset_tests.py
      - run: python training/tests/preflight_tests.py
      - run: python training/tests/training_resume_tests.py
      - run: python training/tests/evaluation_tests.py
      - run: python training/tests/export_tests.py
      - run: python training/tests/local_inference_tests.py
      - run: python plugin/tests/readonly_probe_tests.py
      - run: dotnet run --project plugin/tests/Mcp.GatewayTests -- training/datasets/mcp-v2/data/verified-tools-list.json
      - run: python -m compileall -q training training/tests/training_tests.py
      # Plugin compatibility is verified separately against real installed PINS
      # contracts; CI neither invents host stubs nor downloads models.
